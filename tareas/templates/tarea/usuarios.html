<h1>Usuarios de la tarea: {{ tarea.titulo }}</h1>
<ul>
{% for a in asignaciones %}
    <li>
        {{ a.usuario.nombre }} ({{ a.usuario.correo }})
        · asignado el {{ a.fecha_asignacion|date:"d/m/Y" }}
    </li>
{% empty %}
    <li>Nadie está asignado a esta tarea.</li>
{% endfor %}
</ul>
<a href="{% url 'index' %}">Volver al inicio</a>
