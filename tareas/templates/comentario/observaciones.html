<h1>Tareas con "{{ texto }}" en las observaciones</h1>
<ul>
{% for t in tareas %}
    <li>
        <strong>{{ t.titulo }}</strong> ({{ t.proyecto.nombre }})
        · <a href="{% url 'usuarios_tarea' t.id %}">Ver usuarios</a>
    </li>
{% empty %}
    <li>No hay tareas con ese texto.</li>
{% endfor %}
</ul>
<a href="{% url 'index' %}">Volver al inicio</a>
