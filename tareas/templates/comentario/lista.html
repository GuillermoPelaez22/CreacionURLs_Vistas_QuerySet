<h1>Comentarios de "{{ tarea.titulo }}" que empiezan por "{{ palabra }}" en {{ anyo }}</h1>
<ul>
{% for c in comentarios %}
    <li>
        <strong>{{ c.autor.nombre }}</strong>: {{ c.texto }}
        ({{ c.fecha_comentario|date:"d/m/Y" }})
    </li>
{% empty %}
    <li>No hay comentarios que cumplan la condición.</li>
{% endfor %}
</ul>
<a href="{% url 'index' %}">Volver al inicio</a>
